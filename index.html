function header(back=true,title='👑 Królestwo Melodii'){return `<header class="topbar">${back?`<button class="smallbtn" data-action="back" aria-label="Wróć o jedną sekcję">←</button>`:''}<span class="brand">${esc(title)}</span><div class="topspace"></div><span class="pill">💎 <span id="gems">${save.gems}</span></span><button class="smallbtn" data-action="wardrobe" aria-label="Ubierz księżniczkę">👑</button><button class="smallbtn" data-action="settings" aria-label="Ustawienia rodzica">⚙️</button></header>`}
function show(s,push=true){stopListening();stop();stopVideo();if(push&&s!==screen&&screen!=='welcome')navStack.push({screen,level:selectedLevel,song:selectedSong.id});screen=s;modal=null;render()}
function back(){if(modal){modal=null;render();return;}const prev=navStack.pop();if(!prev){show('home',false);return;}selectedLevel=prev.level;selectedSong=ALL_SONGS.find(l=>l.id===prev.song)||LESSONS[0];show(prev.screen,false)}
function render(){if(screen==='welcome'){document.getElementById('app').innerHTML=welcomeView();attach();setAppOrientation('portrait');return;}let body='';switch(screen){case 'videos':body=videosView();break;case 'home':body=homeView();break;case 'levels':body=levelsView();break;case 'player':body=playerView();break;case 'wardrobe':body=wardrobeView();break;case 'garden':body=gardenView();break;case 'composer':body=composerView();break;case 'faves':body=favesView();break;case 'christmas':body=christmasView();break;case 'patriotic':body=patrioticView();break;default:body=homeView()}
document.getElementById('app').innerHTML=`<div class="shell">${header(screen!=='home',screen==='player'?'🎼 '+selectedSong.title:screen==='levels'?'🎹 Muzyczne przygody':screen==='wardrobe'?'👑 Moja księżniczka':screen==='garden'?'🌷 Muzyczny ogród':screen==='composer'?'🎼 Moja melodia':screen==='faves'?'💜 Ulubione piosenki':screen==='christmas'?'🎄 Świąteczne kolędy':screen==='patriotic'?'🇵🇱 Polskie pieśni':screen==='videos'?'🎬 Występy Lusi':'👑 Królestwo Melodii Lary')}<main class="view">${body}</main></div>${modal?modalView():''}<input class="hiddenfile" type="file" accept=".json,application/json" id="importFile"/><input class="hiddenfile" type="file" accept="video/mp4,.mp4" id="videoImportFile"/>`;attach();if(screen==='player')updatePlaybackVisual()}
const videoState={ready:[],loading:false,busy:null,progress:0,error:'',manage:false,controller:null,importId:null};
let videoUrl=null,videoPlayingId=null,videoPlayRequest=0,videoIsOffline=true;
function welcomeView(){return `<section class="welcome"><img class="welcome-collage" src="./assets/lara-collage.png" alt="Kolaż zdjęć Lary"/><button class="welcome-heart" data-action="enterKingdom" aria-label="Wejdź do Królestwa Melodii Lary"><svg viewBox="0 0 32 32" fill="#ff69b5" aria-hidden="true"><path d="M16 29C12 25 2 18 2 10A8 8 0 0 1 16 5A8 8 0 0 1 30 10C30 18 20 25 16 29Z" stroke="white" stroke-width="1.5"/></svg></button></section>`}
async function setAppOrientation(value){try{await window.screen?.orientation?.lock?.(value);}catch(e){}}
async function enterKingdom(){const root=document.documentElement;if(!document.fullscreenElement&&root?.requestFullscreen){try{await root.requestFullscreen();}catch(e){}}navStack=[];show('home',false);await setAppOrientation('landscape');}
async function fullscreenVideo(){const el=document.getElementById('lusiVideo');if(!el)return;try{if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitEnterFullscreen)el.webkitEnterFullscreen();else notify('Użyj przycisku pełnego ekranu na filmie.');}catch(e){notify('Użyj przycisku pełnego ekranu na filmie.');}}
async function orientVideo(){const el=document.getElementById('lusiVideo'),orientation=window.screen?.orientation;if(!el||!orientation?.lock)return;const info=mediaCatalog().find(v=>v.id===videoPlayingId);const width=el.videoWidth||info?.width,height=el.videoHeight||info?.height;if(!width||!height)return;try{await orientation.lock(width>height?'landscape':'portrait');}catch(e){/* Unsupported lock: native fullscreen and contain preserve the whole frame. */}}
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement?.id==='lusiVideo')orientVideo();else{setAppOrientation(screen==='welcome'?'portrait':'landscape');}});
function mediaCatalog(){return window.LaraVideos?.catalog||[]}
function videoLength(seconds){return Math.floor(Math.round(seconds)/60)+':'+String(Math.round(seconds)%60).padStart(2,'0')}
function stopVideo(){videoPlayRequest++;setAppOrientation(screen==='welcome'?'portrait':'landscape');const el=document.getElementById('lusiVideo');if(el){el.pause();el.removeAttribute('src');el.load();}if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=null;videoPlayingId=null;}
async function openVideos(){videoState.loading=true;videoState.error='';show('videos');try{videoState.ready=await window.LaraVideos.readyIds();}catch(e){videoState.error=e.message;}finally{videoState.loading=false;if(screen==='videos')render();}}
function videosView(){
 if(videoUrl&&videoPlayingId){const v=mediaCatalog().find(x=>x.id===videoPlayingId);return `<section class="video-player"><div class="video-playerbar"><button class="btn slim cream" data-action="videoClose">← Filmy</button><span>${esc(v.title)} · ${v.width} × ${v.height}</span><button class="btn slim blue" data-action="videoFullscreen">⛶ Pełny ekran</button><span>${videoIsOffline?'✓ Zapisany na urządzeniu':'Oglądanie online'}</span></div><video id="lusiVideo" controls playsinline preload="metadata" src="${esc(videoUrl)}" poster="${v.poster}" aria-label="${esc(v.title)}"></video></section>`;}
 return `<section class="video-library"><div class="video-grid">${mediaCatalog().map(v=>{const ready=videoState.ready.includes(v.id),busy=videoState.busy===v.id;return `<article class="video-card panel"><img class="video-poster" src="${v.poster}" alt="Kadr: ${esc(v.title)}"/><div class="video-info"><h2>${esc(v.title)}</h2><p>${videoLength(v.duration)} · ${(v.bytes/1e6).toFixed(1)} MB<br>${v.width} × ${v.height} · oryginalny plik</p>${ready?`<button class="btn purple" data-action="videoPlay" data-video="${v.id}" ${videoState.busy?'disabled':''}>▶ Obejrzyj</button>`:`<button class="btn blue" data-action="videoDownload" data-video="${v.id}" ${videoState.busy||videoState.loading?'disabled':''}>⬇ Zapisz film</button><button class="btn slim ghost" data-action="videoOnline" data-video="${v.id}" ${videoState.busy||videoState.loading?'disabled':''}>▶ Oglądaj online</button>`}<div class="video-status" id="status-${v.id}" role="status">${busy?'Pobieranie: '+videoState.progress+'%':ready?'✓ Gotowy offline':videoState.loading?'Sprawdzam zapis…':'Zapisz raz, oglądaj bez internetu'}</div>${busy?`<progress class="video-progress" id="progress-${v.id}" max="100" value="${videoState.progress}"></progress>${videoState.controller?'<button class="btn slim ghost" data-action="videoCancel">Anuluj</button>':''}`:''}${videoState.manage?`<div class="video-parent"><button class="btn slim cream" data-action="videoImport" data-video="${v.id}" ${videoState.busy?'disabled':''}>Wczytaj plik</button>${ready?`<button class="btn slim ghost" data-action="videoRemove" data-video="${v.id}" ${videoState.busy?'disabled':''}>Usuń z urządzenia</button>`:''}</div>`:''}</div></article>`}).join('')}</div>${videoState.error?`<p class="video-error" role="alert">${esc(videoState.error)}</p>`:''}<div class="video-footer"><span>Po zapisaniu oba filmy działają offline 💜</span><button class="btn slim ghost" data-action="videoManage">⚙️ Pamięć filmów</button></div></section>`;
}
function videoProgress(id,done,total){videoState.progress=Math.floor(done/total*100);const progress=document.getElementById('progress-'+id);if(progress)progress.value=videoState.progress;const status=document.getElementById('status-'+id);if(status)status.textContent=videoState.progress===100?'Sprawdzam i zapisuję…':'Pobieranie: '+videoState.progress+'%';}
async function downloadVideo(id){if(videoState.busy)return;videoState.busy=id;videoState.progress=0;videoState.error='';videoState.controller=new AbortController();render();try{await window.LaraVideos.download(id,{signal:videoState.controller.signal,onProgress:(d,t)=>videoProgress(id,d,t)});videoState.ready=await window.LaraVideos.readyIds();notify('Film zapisany. Możesz oglądać bez internetu 💜');}catch(e){videoState.error=e.name==='AbortError'?'Pobieranie anulowane. Możesz spróbować ponownie.':e.message;}finally{videoState.busy=null;videoState.controller=null;if(screen==='videos')render();}}
async function playVideo(id){stopListening();stop();stopVideo();const request=videoPlayRequest;try{const url=await window.LaraVideos.objectUrl(id);if(screen!=='videos'||request!==videoPlayRequest){URL.revokeObjectURL(url);return;}videoUrl=url;videoPlayingId=id;videoIsOffline=true;render();const el=document.getElementById('lusiVideo');if(el)el.play().catch(()=>{});}catch(e){videoState.error=e.message;videoState.ready=await window.LaraVideos.readyIds().catch(()=>[]);if(screen==='videos')render();}}
async function playOnlineVideo(id){if(videoState.busy)return;stopVideo();const request=videoPlayRequest;videoState.busy=id;videoState.progress=0;videoState.error='';videoState.controller=new AbortController();render();try{const url=await window.LaraVideos.onlineUrl(id,{signal:videoState.controller.signal,onProgress:(d,t)=>videoProgress(id,d,t)});if(screen!=='videos'||request!==videoPlayRequest){URL.revokeObjectURL(url);return;}videoUrl=url;videoPlayingId=id;videoIsOffline=false;}catch(e){videoState.error=e.name==='AbortError'?'Oglądanie anulowane.':e.message;}finally{videoState.busy=null;videoState.controller=null;if(screen==='videos'){render();document.getElementById('lusiVideo')?.play().catch(()=>{});}}}
async function removeVideo(id){stopVideo();try{await window.LaraVideos.remove(id);videoState.ready=await window.LaraVideos.readyIds();videoState.error='';}catch(e){videoState.error=e.message;}if(screen==='videos')render();}
async function importVideo(event){const file=event.target.files?.[0],id=videoState.importId;if(!file||!id||videoState.busy)return;videoState.busy=id;videoState.progress=0;videoState.error='';render();try{await window.LaraVideos.importFile(id,file,(d,t)=>videoProgress(id,d,t));videoState.ready=await window.LaraVideos.readyIds();}catch(e){videoState.error=e.message;}finally{videoState.busy=null;if(screen==='videos')render();}}

function levelsView(){const titles=['🔔 Moje pierwsze piosenki','🐥 Wesołe melodie','🎂 Umiem już więcej!','🍎 Folkowe nutki','👑 Wielka scena'];const descriptions=['Panie Janie, Wlazł kotek','Kurki, niedźwiedź i kotki','Pociąg, Sto lat, Krakowiaczek','Czerwone jabłuszko, Lipka, Czerwone jagody','Bella ciao, W moim ogródecku'];const arr=LESSONS.filter(l=>l.lv===selectedLevel),count=arr.filter(l=>save.done.includes(l.id)).length;return `<section class="level-layout"><nav class="levelrail">${titles.map((t,i)=>`<button class="levelbutton ${selectedLevel===i+1?'selected':''}" data-action="selectLevel" data-level="${i+1}"><span style="font-size:11px;opacity:.83">POZIOM ${i+1}</span><br>${t}</button>`).join('')}</nav><section class="panel levelcards"><div class="levelintro"><div>${titles[selectedLevel-1]}<div class="songsubtitle">${descriptions[selectedLevel-1]} · Każdą piosenkę możesz ćwiczyć od 4 nut lub zagrać w całości.</div></div><span class="tag">🌟 ${count}/${arr.length}</span></div><div class="lesson-grid">${arr.map(l=>`<button class="lesson" data-action="song" data-song="${l.id}"><span class="songemoji">${l.emoji}</span><span class="songtitle">${esc(l.title)}</span><span class="sub">${save.done.includes(l.id)?'⭐ Występ zaliczony':'▶ Zagraj'} · ${l.notes.length} nut · 4 → 8 → 16 → ${l.coverage==='fragment'?'fragment':'całość'}</span>${l.coverage==='fragment'?'<span class="draft-mark">Fragment źródłowy</span>':''}</button>`).join('')}</div></section></section>`}

function christmasView(){return `<div class="scroll christmas-scroll"><div class="panel holiday-banner"><span style="font-size:33px">🎄🌟🦌</span><div><strong>Świąteczne nutki Lary</strong><div class="songsubtitle">Własna kraina kolęd · 4 nutki, zwrotka, refren lub całość</div></div></div><div class="holiday-grid">${CHRISTMAS.map(l=>`<button class="lesson holiday-song" data-action="song" data-song="${l.id}"><span class="songemoji">${l.emoji}</span><strong class="songtitle">${esc(l.title)}</strong><span class="sub">${l.notes.length} nut · 🎵 Cała kolęda</span>${l.note?.includes('potwierdzenia')||l.note?.includes('wstępny')||l.note?.includes('sprawdzenia')?'<span class="draft-mark">Wersja ćwiczebna</span>':''}</button>`).join('')}${CHRISTMAS_PENDING.map(l=>`<div class="lesson holiday-song pending"><span class="songemoji">${l.emoji}</span><strong class="songtitle">${esc(l.title)}</strong><span class="sub">🎼 ${esc(l.why)}</span></div>`).join('')}</div></div>`}
function patrioticView(){return `<div class="scroll christmas-scroll"><div class="panel holiday-banner patriotic-banner"><span style="font-size:33px">🇵🇱🌹🎼</span><div><strong>Polskie pieśni</strong><div class="songsubtitle">Cztery pieśni z przesłanych nut · Nauka od 4 nut lub cała melodia</div></div></div><div class="holiday-grid">${PATRIOTIC.map(l=>`<button class="lesson holiday-song" data-action="song" data-song="${l.id}"><span class="songemoji">${l.emoji}</span><strong class="songtitle">${esc(l.title)}</strong><span class="sub">🎵 ${l.notes.filter(n=>n.p!=='REST').length} nut · ${l.meter} · ${l.bpm} BPM</span><span class="draft-mark">Melodia z PDF · ▶ Zagraj</span></button>`).join('')}</div><div class="panel" style="margin-top:10px;padding:12px;font-size:12px">📖 Śpiewnik zawiera teksty wszystkich czterech pieśni, w tym osiem zwrotek „Białych róż”. Własne wersje tekstów można dodać przez ✏️. Przy hymnie stosuj urzędowy wzorzec wykonawczy.</div></div>`}
function piano(current='',interactive=false,composer=false){const ns=!composer&&selectedSong?selectedSong.events.map(e=>e.p):[];const low=ns.some(p=>['G3','G#3','A3','A#3','B3'].includes(p));const upper=ns.some(p=>idx(p)>idx('C5'));const whites=(low?['G3','A3','B3']:[]).concat(['C','D','E','F','G','A','B','C5'],upper?['D5','E5','F5','G5']:[]);const blacks=whites.slice(0,-1).flatMap((p,i)=>{const cp=p.replace(/[35]$/,'');let suf=p.endsWith('3')?'3':p.endsWith('5')?'5':'';return ['C','D','F','G','A'].includes(cp)?[{p:cp+'#'+suf,after:i}]:[]});const width=100/whites.length;return `<div class="keybed-wrap"><div class="keybed" data-keyboard="1">${whites.map(p=>`<button aria-label="Nuta ${noteLabel(p)}" class="piano-white ${current===p?'lit':''}" data-action="${composer?'composeNote':'tapNote'}" data-note="${p}"><span>${noteLabel(p)}</span></button>`).join('')}${blacks.map(o=>`<button aria-label="Nuta ${noteLabel(o.p)}" class="piano-black ${current===o.p?'lit':''}" style="left:calc(${(o.after+1)*width}% - ${width*.33}%);width:${width*.66}%" data-action="${composer?'composeNote':'tapNote'}" data-note="${o.p}">${noteLabel(o.p)}</button>`).join('')}</div></div>`}
function trainingOptions(){const n=selectedSong.events.length,opts=[];for(const k of [4,8,16,32]){if(n>=k)opts.push({id:'n'+k,label:k+' nut',first:0,last:k});}selectedSong.sections.forEach((s,i)=>{if(s.last>s.first)opts.push({id:'s'+i,label:s.label,first:s.first,last:s.last});});opts.push({id:'all',label:selectedSong.coverage==='fragment'?'Cały dostępny fragment':'Cała piosenka',first:0,last:n});return opts;}
function activeBounds(){const opt=trainingOptions().find(x=>x.id===rangeChoice)||trainingOptions().at(-1);let first=opt.first,last=opt.last,events=selectedSong.events;return {start:events[first]?.at||0,end:events[last-1]?.at+events[last-1]?.d||selectedSong.total,first,last};}
function currentPhrase(){return selectedSong.phrases.find(p=>beat>=p.start&&beat<p.end)||selectedSong.phrases.at(-1);}
function singAlongLine(){const phrase=currentPhrase()?.text||'♪';return /^(🎶|melodia |zagraj|powtórz|zaśpiewaj)/i.test(phrase.trim())?selectedSong.title:phrase;}
function moveRange(delta){const opts=trainingOptions(),i=Math.max(0,opts.findIndex(o=>o.id===rangeChoice));chooseRange(opts[Math.max(0,Math.min(opts.length-1,i+delta))].id);}
function chooseRange(id){stopListening();stop();if(!trainingOptions().some(o=>o.id===id))return;rangeChoice=id;const bounds=activeBounds();beat=bounds.start;stepIndex=bounds.first;mode='demo';render()}

function detectPitchYin(samples,sampleRate){
 const length=samples.length;
 let energy=0;
 for(let i=0;i<length;i++){energy+=samples[i]*samples[i];}
 const rms=Math.sqrt(energy/length);
 if(rms<.012)return null;
 const minLag=Math.max(2,Math.floor(sampleRate/920));
 const maxLag=Math.min(Math.floor(sampleRate/175),Math.floor(length/3));
 const windowSize=Math.min(2304,length-maxLag);
 if(maxLag<=minLag)return null;
 let running=0,first=0,bestScore=1,bestLag=0,valleyLag=0,valleyScore=1;
 for(let lag=1;lag<=maxLag;lag++){
  let difference=0;
  for(let i=0;i<windowSize;i++){
   const v=samples[i]-samples[i+lag];difference+=v*v;
  }
  running+=difference;
  const score=running>0?difference*lag/running:1;
  if(lag>=minLag){
   if(score<bestScore){bestScore=score;bestLag=lag;}
   // Prefer the first *local minimum* rather than the threshold crossing.
   if(score<.20){
    if(score<valleyScore){valleyScore=score;valleyLag=lag;}
    else if(valleyLag&&lag>valleyLag+1){if(valleyScore<.17){first=valleyLag;break;}valleyLag=0;valleyScore=1;}
   } else if(valleyLag){if(valleyScore<.17){first=valleyLag;break;}valleyLag=0;valleyScore=1;}
  }
 }
 let lag=first||bestLag;
 if(!lag||bestScore>.25 && !first)return null;
 // A refinement at local minimum improves the semitone accuracy.
 if(first){
  let winner=first,score=Number.POSITIVE_INFINITY;
  for(let l=Math.max(minLag,first-2);l<=Math.min(maxLag,first+3);l++){
   let dif=0;for(let i=0;i<windowSize;i++){let v=samples[i]-samples[i+l];dif+=v*v;}
   if(dif<score){winner=l;score=dif;}
  }lag=winner;
 }
 const freq=sampleRate/lag;
 if(!Number.isFinite(freq)||freq<170||freq>950)return null;
 const midi=69+12*Math.log2(freq/440);
 const rounded=Math.round(midi);
 return {freq,midi:rounded,cents:Math.abs(midi-rounded)*100,rms,clarity:1-bestScore};
}
function targetMidi(p){const i=idx(p);return i<0?null:60+i-idx('C');}
function micNextRest(){
 const expected=selectedSong.events[stepIndex];
 if(!expected||expected.p!=='REST'){micRestAt=0;return false;}
 if(!micRestAt)micRestAt=performance.now();
 const milliseconds=Math.max(250,expected.d*60000/bpm);
 micStatus('⏳ Pauza… zaraz następna nutka');
 if(performance.now()-micRestAt>=milliseconds){micRestAt=0;nextStep();}
 return true;
}
function listenFrame(){
 if(!micActive||!micAnalyser||screen!=='player'||mode!=='step')return;
 if(stepIndex>=activeBounds().last){stopListening();return;}
 if(micNextRest())return;
 let data=new Float32Array(micAnalyser.fftSize);
 micAnalyser.getFloatTimeDomainData(data);
 const pitch=detectPitchYin(data,micCtx.sampleRate);
 const ev=selectedSong.events[stepIndex];
 const expected=ev.p;
 const now=performance.now();
 if(!pitch||pitch.cents>36){
  micCandidate='';micHits=0;
  if(micRelease&&++micSilentFrames>=2){micRelease=false;micSilentFrames=0;}
  micStatus(micRelease?'🔔 Puść klawisz i zagraj jeszcze raz':`🎹 Zagraj ${noteLabel(expected)} · ${noteSol(expected)}`);
  return;
 }
 micSilentFrames=0;
 if(micRelease){
  if(pitch.midi!==targetMidi(expected)){micRelease=false;}
  else{micStatus('🔔 Puść klawisz i naciśnij ponownie');return;}
 }
 if(micCandidate===String(pitch.midi)){micHits++;}
 else{micCandidate=String(pitch.midi);micHits=1;micStableAt=now;}
 const actual=NOTES[pitch.midi-(60-idx('C'))];
 if(pitch.midi!==targetMidi(expected)){
  if(micHits>=2)micStatus(`🎵 Słyszę ${actual?noteLabel(actual):'inny dźwięk'} · szukamy ${noteLabel(expected)}`,'try');
  return;
 }
 micStatus(`✨ Słyszę ${noteLabel(expected)}!`,'good');
 if(micHits>=2&&now-micStableAt>=85&&now-micLastAdvance>=240){
  const prior=expected;
  micLastAdvance=now;
  nextStep();
  if(stepIndex>=activeBounds().last){stopListening();notify('🌟 Brawo! To był cały wybrany fragment!');return;}
  const next=selectedSong.events[stepIndex];
  micCandidate='';micHits=0;
  micRelease=next?.p===prior;
  micStatus(micRelease?'🔔 Puść klawisz przed powtórzeniem':`🌟 Świetnie! Teraz ${noteLabel(next.p)}`,'good');
 }
}
async function toggleMicStep(){
 if(micActive||micPending){stopListening();render();return;}
 if(!navigator.mediaDevices?.getUserMedia){
  notify('🎙️ Mikrofon nie jest dostępny w tym pliku. Otwórz PWA przez HTTPS w Chrome.');
  return;
 }
 stop();mode='step';const b=activeBounds();beat=b.start;stepIndex=b.first;
 micPending=true;const run=++micRunId;render();
 let stream=null,ctx=null;
 try{
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});}
  catch(e){if(e.name==='OverconstrainedError')stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});else throw e;}
  if(run!==micRunId){stream.getTracks().forEach(t=>t.stop());return;}
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  await ctx.resume();
  if(run!==micRunId){stream.getTracks().forEach(t=>t.stop());ctx.close();return;}
  const source=ctx.createMediaStreamSource(stream);
  const analyser=ctx.createAnalyser();analyser.fftSize=4096;analyser.smoothingTimeConstant=0;
  source.connect(analyser);
  micStream=stream;micCtx=ctx;micSource=source;micAnalyser=analyser;
  micPending=false;micActive=true;micLastAdvance=performance.now()-500;
  render();micStatus('🎙️ Nasłuch włączony — zagraj pierwszy klawisz','good');
  micTimer=setInterval(listenFrame,75);
 }catch(e){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(ctx)ctx.close().catch(()=>{});
  if(run!==micRunId)return;
  stopListening();render();
  if(e?.name==='NotAllowedError'||e?.name==='PermissionDeniedError')notify('🎙️ Zezwól Chrome na mikrofon i spróbuj ponownie.');
  else if(e?.name==='NotFoundError'||e?.name==='DevicesNotFoundError')notify('🎙️ Nie znaleziono mikrofonu. Sprawdź mikrofon na tym urządzeniu.');
  else if(e?.name==='NotReadableError'||e?.name==='TrackStartError')notify('🎙️ Mikrofon jest zajęty. Zamknij inne aplikacje korzystające z mikrofonu.');
  else notify('🎙️ Nie udało się uruchomić mikrofonu. Sprawdź dostęp w Chrome i spróbuj ponownie.');
 }
}

function startStep(){stopListening();stop();mode='step';const bounds=activeBounds();beat=bounds.start;stepIndex=bounds.first;render();notify('Zagraj podświetloną nutkę i kliknij Dalej! 🎹')}
function nextStep(){if(mode!=='step')return;stepIndex=Math.min(activeBounds().last,stepIndex+1);if(stepIndex===activeBounds().last){beat=activeBounds().end;render();notify('Brawo! Teraz możesz dać występ! 👑');return}beat=selectedSong.events[stepIndex].at;render()}
function finishShow(good){stop();const whole=rangeChoice==='all'&&selectedSong.coverage!=='fragment';if(!save.shows.includes(selectedSong.id)){save.shows.push(selectedSong.id);save.gems+=3}if(good&&whole&&!save.done.includes(selectedSong.id)){save.done.push(selectedSong.id);save.gems+=5}persist();modal={type:'result',good,whole};render();playAudience(good)}
function ensureAudio(){try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.22;master.connect(audio.destination)}if(audio.state==='suspended')audio.resume();return true}catch(e){notify('W tym telefonie dźwięk jest niedostępny.');return false}}
function hz(p){let n=idx(p);return n<0?0:261.625565*Math.pow(2,(n-idx('C'))/12)}
function playTone(p,dur=.5,start=null){if(p==='REST'||!ensureAudio())return;const at=start??audio.currentTime+.007;const osc=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();osc.type='triangle';osc.frequency.setValueAtTime(hz(p),at);filter.type='lowpass';filter.frequency.value=2100;osc.connect(filter);filter.connect(g);g.connect(master);g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.7,at+.016);g.gain.exponentialRampToValueAtTime(.23,at+.12);g.gain.exponentialRampToValueAtTime(.002,at+Math.max(.13,dur));osc.start(at);osc.stop(at+Math.max(.13,dur)+.025);voices.push(osc);if(voices.length>160)voices.shift()}
function silence(){voices.forEach(v=>{try{v.stop()}catch(e){}});voices=[]}
function startMode(m){stopListening();stop();beat=activeBounds().start;mode=m;playing=true;lastTick=performance.now();nextEvent=activeBounds().first;sessionCounter++;ensureAudio();render();lastTick=performance.now();scheduleTick();requestWake()}
function pause(){if(!playing)return;playing=false;cancelAnimationFrame(raf);silence();releaseWake();render()}
function resume(){if(beat>=activeBounds().end)beat=activeBounds().start;if(mode==='step'){startMode('practice');return}mode=mode||'demo';playing=true;lastTick=performance.now();nextEvent=Math.max(0,selectedSong.events.findIndex(e=>e.at>=beat-1e-4));if(nextEvent<0)nextEvent=activeBounds().last;ensureAudio();if(mode==='demo')resumeCurrentNote();render();scheduleTick();requestWake()}
function stop(){playing=false;cancelAnimationFrame(raf);silence();releaseWake()}
function resumeCurrentNote(){const ev=selectedSong.events.find(e=>e.at+0.006<beat&&e.at+e.d>beat);if(ev&&ev.p!=='REST')playTone(ev.p,Math.max(.12,(ev.at+ev.d-beat)*60/bpm*.86))}
function setTempo(n){bpm=Math.max(40,Math.min(180,n));if(playing){silence();nextEvent=Math.max(0,selectedSong.events.findIndex(e=>e.at>=beat-.002));if(nextEvent<0)nextEvent=selectedSong.events.length;lastTick=performance.now();if(mode==='demo')resumeCurrentNote()}document.getElementById('bpmLabel')&&(document.getElementById('bpmLabel').textContent=bpm+' BPM')}
function scheduleTick(){if(!playing||screen!=='player')return;const t=performance.now();beat+=(t-lastTick)*bpm/60000;lastTick=t;if(beat>=activeBounds().end){if(loopPhrase){beat=activeBounds().start;nextEvent=activeBounds().first;silence();lastTick=t;}else{beat=activeBounds().end;playing=false;silence();releaseWake();updatePlaybackVisual();document.getElementById('playStatus')&&(document.getElementById('playStatus').textContent='🌟 Brawo! Wybierz Dalej ▶ albo Cała piosenka 🎵.');return}}if(mode==='demo'&&audio){while(nextEvent<activeBounds().last&&selectedSong.events[nextEvent].at<=beat+bpm*.11/60){let ev=selectedSong.events[nextEvent];if(ev.at>=beat-.09)playTone(ev.p,Math.max(.1,ev.d*60/bpm*.86),audio.currentTime+Math.max(.008,(ev.at-beat)*60/bpm));nextEvent++}}updatePlaybackVisual();raf=requestAnimationFrame(scheduleTick)}
function updatePlaybackVisual(){if(screen!=='player')return;let es=selectedSong.events;let current=es.findIndex((e,i)=>beat>=e.at&&beat<e.at+e.d);if(current<0)current=beat>=activeBounds().end?activeBounds().last-1:activeBounds().first;let ev=es[Math.max(0,Math.min(es.length-1,current))];const n=document.getElementById('liveNote'),s=document.getElementById('liveSol');if(n)n.textContent=noteLabel(ev.p);if(s)s.textContent=save.preferences.solfege?noteSol(ev.p):'♪';const ribbon=document.getElementById('ribbon');if(ribbon){const pos=Math.max(activeBounds().first,current-2),slice=es.slice(pos,Math.min(activeBounds().last,pos+7));ribbon.innerHTML=slice.map(e=>{let i=es.indexOf(e);return `<div class="beat-note ${i===current?'current':i===current+1?'next':''} ${e.p==='REST'?'rest':''}">${noteLabel(e.p)}<small>${e.d===.5?'½':e.d===1?'♪':e.d===2?'—':e.d+'×'}</small></div>`}).join('')}document.querySelectorAll('.piano-white,.piano-black').forEach(k=>k.classList.toggle('lit',ev.p!=='REST'&&k.dataset.note===ev.p));const f=document.getElementById('musicFill');if(f)f.style.width=Math.max(0,Math.min(100,(beat-activeBounds().start)/(activeBounds().end-activeBounds().start)*100))+'%';const lyr=document.getElementById('lyricsLine');if(lyr)lyr.textContent=singAlongLine();const status=document.getElementById('playStatus');if(status&&playing)status.textContent=mode==='demo'?'🔊 Słuchaj, patrz i zapamiętuj nutki':'🎹 Teraz gra Lara — podążaj za świecącymi klawiszami';const b=document.querySelector('[data-action="togglePlay"]');if(b)b.textContent=playing?'⏸ Pauza':'▶ Start'}
async function requestWake(){try{if('wakeLock'in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}}
function playSequence(seq,b=92){if(!seq.length||!ensureAudio())return;let time=audio.currentTime+.05;seq.forEach(p=>{playTone(p,.45,time);time+=60/b})}
function playAudience(good){if(!ensureAudio())return;const start=audio.currentTime+.04;if(good){for(let i=0;i<68;i++){const t=start+Math.random()*2.6;const dur=.025+Math.random()*.06;const buffer=audio.createBuffer(1,Math.ceil(audio.sampleRate*dur),audio.sampleRate);const a=buffer.getChannelData(0);for(let j=0;j<a.length;j++)a[j]=(Math.random()*2-1)*(1-j/a.length);let src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=buffer;filter.type='bandpass';filter.frequency.value=700+Math.random()*1700;filter.Q.value=.6;gain.gain.value=.28+Math.random()*.3;src.connect(filter);filter.connect(gain);gain.connect(master);src.start(t)}[['C5',0],['G',.2],['A',.4],['C5',.65]].forEach(([p,dt])=>playTone(p,.28,start+dt))}else{for(let i=0;i<5;i++){const osc=audio.createOscillator(),gain=audio.createGain(),fil=audio.createBiquadFilter(),at=start+i*.05;osc.type='sawtooth';osc.frequency.setValueAtTime(250+i*34,at);osc.frequency.exponentialRampToValueAtTime(185+i*26,at+.7);fil.type='lowpass';fil.frequency.value=530;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.08,at+.16);gain.gain.linearRampToValueAtTime(.002,at+.8);osc.connect(fil);fil.connect(gain);gain.connect(master);osc.start(at);osc.stop(at+.81)}setTimeout(()=>playTone('C5',.4),750)}}
function notify(txt){let old=document.querySelector('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=txt;document.body.appendChild(el);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.remove(),3200)}
function exportSave(){const payload={format:'krolestwo-lary',version:1,exportedAt:new Date().toISOString(),data:save};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});let link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='Lara-postepy-krolestwo.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),3000);notify('Postępy zapisane do pliku! 💜')}
function migrateSongId(s){return ({panie3:'panie',panie2:'panie',kotek3:'kotek',kotek1:'kotek',mis3:'mis',mis1:'mis',kurki1:'kurki',stolat1:'stolat',jablkobis:'jablko',bellap:'bella',lipka:'lipka'})[s]||s;}
function importSongbooks(books){
 if(!books||typeof books!=='object'||Array.isArray(books))return {};
 return Object.fromEntries(Object.entries(books).map(([id,pages])=>[migrateSongId(id),pages])
  .filter(([id,pages])=>ALL_SONGS.some(song=>song.id===id)&&Array.isArray(pages))
  .map(([id,pages])=>[id,pages.filter(p=>p&&typeof p.heading==='string'&&typeof p.lines==='string').slice(0,25)
   .map(p=>({heading:p.heading.slice(0,120),lines:p.lines.slice(0,16000)}))]));
}

async function diagnosePWA(){
 const results=[];const protocol=location.protocol;
 results.push(['HTTPS',protocol==='https:'||['localhost','127.0.0.1','[::1]'].includes(location.hostname)]);
 try{const r=await fetch('./manifest.webmanifest',{cache:'no-store'});const obj=await r.json();results.push(['Manifest',r.ok&&!!obj.name&&!!obj.start_url]);
  for(const size of [192,512]){const icon=(obj.icons||[]).find(x=>x.sizes?.includes(size+'x'+size));if(!icon){results.push(['Ikona '+size,false]);continue}
  const ir=await fetch(new URL(icon.src,location.href),{cache:'no-store'});results.push(['Ikona '+size,ir.ok&&(ir.headers.get('content-type')||'').includes('image')]);}}
 catch(e){results.push(['Manifest i ikony',false]);}
 try{
  if(!('serviceWorker' in navigator))throw Error('Brak obsługi');
  const registration=await Promise.race([navigator.serviceWorker.ready,new Promise((_,reject)=>setTimeout(()=>reject(Error('Limit czasu')),8000))]);
  results.push(['Service worker',!!registration.active]);
  const checks=await Promise.all(['./','./index.html','./manifest.webmanifest','./icon-192.png','./icon-512.png','./icon-maskable-512.png'].map(async path=>!!(await caches.match(new URL(path,location.href).href))));
  results.push(['Pliki offline',checks.every(Boolean)]);
 }catch(e){results.push(['Tryb offline',false]);}
 const details=results.map(([k,v])=>(v?'✅ ':'❌ ')+k).join(' | ')+' | Więcej: ./install-check.html';
 notify(details);
 if(modal?.type==='settings'){modal={type:'pwaCheck',details,allGood:results.every(x=>x[1])};render();}}
